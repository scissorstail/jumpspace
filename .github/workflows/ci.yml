name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # 앱은 Windows + Git Bash에서 쓰는 것이라, 단위 테스트를 Windows에서도 돌린다.
  # ssh-script.test.js가 생성된 스크립트를 Git Bash로 실행해서(서버 없이) 스크립트 실행 권한,
  # 환경변수 전달, 경로 인용, SSH_ASKPASS 동작을 확인한다.
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      JUMPSPACE_TEST_BASH: C:\Program Files\Git\bin\bash.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --exclude "**/ssh-script.test.js"
      - name: Scripts under Git Bash
        timeout-minutes: 5
        env:
          JUMPSPACE_TEST_VERBOSE: '1'
        run: npx vitest run src/main/ssh-script.test.js --reporter=verbose
      # 앱이 실제로 실행하는 git-bash.exe(mintty를 띄우는 런처)로도 스크립트가 시작되는지 확인한다.
      - name: git-bash.exe launcher
        timeout-minutes: 3
        env:
          JUMPSPACE_TEST_GIT_BASH_EXE: C:\Program Files\Git\git-bash.exe
          JUMPSPACE_TEST_VERBOSE: '1'
        run: npx vitest run src/main/ssh-script.test.js -t "git-bash.exe" --reporter=verbose
      - run: npm run build
      # 설치 파일은 Windows에서 만든다(리눅스에서는 NSIS 단계에 wine이 필요하다). 실행 결과의 Artifacts에서 받을 수 있다.
      - name: Installer
        run: npx electron-builder --config electron-builder.config.js --win nsis --x64 --publish never
      # 패키지 안의 node-pty(Windows용 prebuild)가 로드되고 ConPTY로 프로세스를 띄우는지 확인한다.
      - name: node-pty in the package
        shell: bash
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: |
          exe=$(ls dist_electron/win-unpacked/*.exe)
          "$exe" .github/scripts/packaged-pty.cjs dist_electron/win-unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: jumpspace-windows-installer
          path: dist_electron/*.exe
          if-no-files-found: error
          retention-days: 30
